<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Generate ADAPT-ready QTI question banks from LibreTexts textbooks, entirely in your browser." />
    <meta name="theme-color" content="#127bc4" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>LibreTexts Question Studio</title>
    <script>
      // Apply a saved dark theme before the first paint (src/state/theme.ts owns the key).
      try {
        if (localStorage.getItem('question-studio-theme') === 'dark') document.documentElement.dataset.theme = 'dark'
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
